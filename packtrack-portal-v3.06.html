<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PackTrack — Choose your workspace</title>
  <style>
    :root{color-scheme:dark;--ink:#e6edf3;--muted:#7d8590;--line:#30363d;--panel:#161b22;--bg:#0d1117;--accent:#f0883e;--accent-bg:rgba(240,136,62,.12)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}
    main{max-width:760px;margin:10vh auto;padding:24px}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
    .brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#0d1117;font-size:20px}
    h1{margin:35px 0 4px;font-size:29px;letter-spacing:-.5px}.muted{color:var(--muted);margin:0 0 20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;min-height:176px}
    h2{font-size:17px;margin:0 0 14px}.panel p{color:var(--muted);min-height:48px;margin:0 0 16px}.btn{display:inline-block;background:var(--accent);color:#0d1117;border-radius:6px;padding:10px 15px;font-weight:700;text-decoration:none;font-size:13px}
    .btn:hover{filter:brightness(1.1)}.version{margin-top:24px;color:var(--muted);font-size:11px;font-family:monospace}
    @media(max-width:640px){main{margin:5vh auto}.grid{grid-template-columns:1fr}h1{font-size:25px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="brand-mark">▦</div><span>PackTrack</span></div>
    <h1>Choose your workspace</h1>
    <p class="muted">Connected to your company Firebase project.</p>
    <div class="grid">
      <section class="panel">
        <h2>PC Administration</h2>
        <p>Products, employees, salary reports and administration.</p>
        <a class="btn" href="packtrack-admin.html">Open PC admin</a>
      </section>
      <section class="panel">
        <h2>Logistics / Packer</h2>
        <p>Employee login for scanning, packing records and work history.</p>
        <a class="btn" href="packtrack-mobile.html">Open mobile login</a>
      </section>
    </div>
    <div class="version">PackTrack portal v3.06</div>
  </main>
</body>
</html>
